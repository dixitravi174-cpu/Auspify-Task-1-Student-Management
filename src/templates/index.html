<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.07); }
        .table thead { background-color: #212529; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Task 1: Student Management System</span>
        </div>
    </nav>

    <div class="container">
        <!-- Add Student Form -->
        <div class="card p-4 mb-4">
            <h4 class="card-title mb-3 text-primary">Add New Student</h4>
            <form action="/add" method="POST">
                <div class="row g-3">
                    <div class="col-md-2">
                        <input type="text" name="roll_no" class="form-control" placeholder="Roll No" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="col-md-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="course" class="form-control" placeholder="Course" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="phone" class="form-control" placeholder="Phone" required>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary px-4">+ Add Student</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Student Records Table -->
        <div class="card p-4">
            <h4 class="card-title mb-3 text-secondary">Student Records List</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Phone</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <form action="/update/{{ student['id'] }}" method="POST">
                                <td><input type="text" name="roll_no" class="form-control form-control-sm" value="{{ student['roll_no'] }}" required></td>
                                <td><input type="text" name="name" class="form-control form-control-sm" value="{{ student['name'] }}" required></td>
                                <td><input type="email" name="email" class="form-control form-control-sm" value="{{ student['email'] }}" required></td>
                                <td><input type="text" name="course" class="form-control form-control-sm" value="{{ student['course'] }}" required></td>
                                <td><input type="text" name="phone" class="form-control form-control-sm" value="{{ student['phone'] }}" required></td>
                                <td class="text-center">
                                    <button type="submit" class="btn btn-success btn-sm me-1">Update</button>
                                    <a href="/delete/{{ student['id'] }}" class="btn btn-danger btn-sm" onclick="return confirm('Kya aap is student ko delete karna chahte hain?')">Delete</a>
                                </td>
                            </form>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="6" class="text-center text-muted py-3">Abhi koi student record nahi hai. Upar diye gaye form se naya record add karein.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
